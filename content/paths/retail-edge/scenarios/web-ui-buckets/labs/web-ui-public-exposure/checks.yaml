checks:
  - id: web-ui-private
    argv: ["aws", "s3api", "get-public-access-block", "--bucket", "retaildemostore-web-ui"]
    expect_exit: 0
    expect_json:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  - id: web-ui-encrypted
    argv: ["aws", "s3api", "get-bucket-encryption", "--bucket", "retaildemostore-web-ui"]
    expect_exit: 0
    expect_json_includes:
      ServerSideEncryptionConfiguration:
        Rules:
          - ApplyServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  - id: logging-bucket-preserved
    argv: ["aws", "s3api", "get-bucket-versioning", "--bucket", "retaildemostore-logging"]
    expect_exit: 0
    expect_json:
      Status: Enabled
