checks:
  - id: source-bucket-versioned
    argv: ["aws", "s3api", "get-bucket-versioning", "--bucket", "retaildemostore-pipeline-source"]
    expect_exit: 0
    expect_json:
      Status: Enabled
  - id: source-bucket-private
    argv: ["aws", "s3api", "get-public-access-block", "--bucket", "retaildemostore-pipeline-source"]
    expect_exit: 0
    expect_json:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  - id: ecr-repo-preserved
    argv: ["aws", "ecr", "describe-repositories", "--repository-names", "retaildemostore/products"]
    expect_exit: 0
